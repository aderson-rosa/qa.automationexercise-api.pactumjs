name: CI

on:
  push:
    branches: [main]
  pull_request:

# Necessário para publicar o relatório no GitHub Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dois deploys do relatório concorram entre si.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Executar testes de API (funcionais + contrato)
        run: npm test

      # O Allure CLI roda sobre a JVM; o Java só é necessário para gerar o HTML.
      - uses: actions/setup-java@v4
        if: always()
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerar relatório Allure
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publicar relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Preparar relatório para o GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

  # O relatório da última execução da main fica publicado em uma URL fixa,
  # acessível sem precisar baixar artefatos.
  publicar-relatorio:
    needs: api-tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
